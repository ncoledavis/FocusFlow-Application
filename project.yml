name: FocusFlow
options:
  bundleIdPrefix: com.focusflow
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    minVersion: "13.1.1"
    maxVersion: "14.0.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    GENERATE_INFOPLIST_FILE: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  FocusFlow:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FocusFlow
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.focusflow.app
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        TARGETED_DEVICE_FAMILY: "1,2"

  FocusFlowTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FocusFlowTests
    dependencies:
      - target: FocusFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.focusflow.app.tests

schemes:
  FocusFlow:
    build:
      targets:
        FocusFlow: all
        FocusFlowTests: [test]
    test:
      targets:
        - FocusFlowTests
      gatherCoverageData: true
